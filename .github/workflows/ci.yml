name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ci:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.7
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: apps/server
        run: uv sync --frozen --extra dev

      - name: Lint frontend and workspace
        run: bun run lint:eslint

      - name: Lint backend
        run: bun run check:server

      - name: Type check
        run: bun run check-types

      - name: Test frontend
        run: bun run test

      - name: Test backend
        run: bun run test:server

      - name: Build
        run: bun run build

  deploy-render:
    name: Deploy API to Render
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Validate Render deployment secrets
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "Missing RENDER_DEPLOY_HOOK_URL secret"; exit 1; }
          test -n "$RENDER_API_KEY" || { echo "Missing RENDER_API_KEY secret"; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "Missing RENDER_SERVICE_ID secret"; exit 1; }
          test -n "$RENDER_HEALTHCHECK_URL" || { echo "Missing RENDER_HEALTHCHECK_URL secret"; exit 1; }

      - name: Trigger Render deployment
        id: trigger-render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "Missing RENDER_DEPLOY_HOOK_URL secret"; exit 1; }
          response="$(curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL")"
          deploy_id="$(jq -er '.id // .deploy.id' <<< "$response")" || {
            echo "Render did not return a deploy ID; cannot verify this deployment"
            exit 1
          }
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for this commit to go live on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_ID: ${{ steps.trigger-render.outputs.deploy_id }}
        run: |
          test -n "$RENDER_API_KEY" || { echo "Missing RENDER_API_KEY secret"; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "Missing RENDER_SERVICE_ID secret"; exit 1; }
          for attempt in $(seq 1 60); do
            response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$RENDER_DEPLOY_ID")"
            status="$(jq -r '.status // .deploy.status // empty' <<< "$response")"
            commit_sha="$(jq -r '.commit.id // .deploy.commit.id // empty' <<< "$response")"
            echo "Render deployment status: ${status:-unknown}"

            if [[ -n "$commit_sha" && "$commit_sha" != "$GITHUB_SHA" ]]; then
              echo "Render is deploying $commit_sha instead of the merged commit $GITHUB_SHA"
              exit 1
            fi
            if [[ "$status" == "live" ]]; then
              test "$commit_sha" = "$GITHUB_SHA" || {
                echo "Render marked the deployment live without the expected commit SHA"
                exit 1
              }
              exit 0
            fi
            case "$status" in
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "Render deployment failed with status $status"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for the Render deployment to become live"
          exit 1

      - name: Check Render health endpoint
        env:
          RENDER_HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
        run: |
          test -n "$RENDER_HEALTHCHECK_URL" || { echo "Missing RENDER_HEALTHCHECK_URL secret"; exit 1; }
          for attempt in $(seq 1 20); do
            if curl --location --fail --silent --show-error --max-time 10 "$RENDER_HEALTHCHECK_URL" >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          echo "Render health check did not succeed"
          exit 1

  deploy-vercel:
    name: Deploy frontend to Vercel
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Validate Vercel deployment secrets
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL" || { echo "Missing VERCEL_DEPLOY_HOOK_URL secret"; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID secret"; exit 1; }

      - name: Trigger Vercel deployment
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        id: trigger-vercel
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL" || { echo "Missing VERCEL_DEPLOY_HOOK_URL secret"; exit 1; }
          echo "started_at=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL" >/dev/null

      - name: Wait for this commit to deploy on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          DEPLOY_STARTED_AT: ${{ steps.trigger-vercel.outputs.started_at }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID secret"; exit 1; }
          team_args=()
          if [[ -n "$VERCEL_TEAM_ID" ]]; then
            team_args+=(--data-urlencode "teamId=$VERCEL_TEAM_ID")
          fi
          for attempt in $(seq 1 60); do
            response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --get \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --data-urlencode "projectId=$VERCEL_PROJECT_ID" \
              --data-urlencode "target=production" \
              --data-urlencode "branch=main" \
              --data-urlencode "sha=$GITHUB_SHA" \
              --data-urlencode "since=$DEPLOY_STARTED_AT" \
              --data-urlencode "limit=5" \
              "${team_args[@]}" \
              https://api.vercel.com/v7/deployments)"
            state="$(jq -r '.deployments[0].state // empty' <<< "$response")"
            deployment_url="$(jq -r '.deployments[0].url // empty' <<< "$response")"
            echo "Vercel deployment state: ${state:-not found yet}"

            if [[ "$state" == "READY" ]]; then
              test -n "$deployment_url" || {
                echo "Vercel marked the deployment ready without a URL"
                exit 1
              }
              curl --location --fail --silent --show-error \
                --max-time 20 "https://$deployment_url" >/dev/null
              exit 0
            fi
            case "$state" in
              ERROR|CANCELED|BLOCKED)
                echo "Vercel deployment failed with state $state"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for the Vercel deployment to become ready"
          exit 1
