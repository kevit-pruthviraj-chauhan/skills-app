name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  ci:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.7
          enable-cache: true
          cache-dependency-glob: apps/server/uv.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: apps/server
        run: uv sync --frozen --extra dev

      - name: Lint frontend and workspace
        run: bun run lint:eslint

      - name: Lint backend
        run: bun run check:server

      - name: Type check
        run: bun run check-types

      - name: Test frontend
        run: bun run test

      - name: Test backend
        run: bun run test:server

      - name: Build
        run: bun run build

  deploy-render:
    name: Deploy API to Render
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "Missing RENDER_DEPLOY_HOOK_URL secret"; exit 1; }
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Check Render health endpoint
        env:
          RENDER_HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
        run: |
          test -n "$RENDER_HEALTHCHECK_URL" || { echo "Missing RENDER_HEALTHCHECK_URL secret"; exit 1; }
          for attempt in $(seq 1 20); do
            if curl --location --fail --silent --show-error --max-time 10 "$RENDER_HEALTHCHECK_URL" >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          echo "Render health check did not succeed"
          exit 1

  deploy-vercel:
    name: Deploy frontend to Vercel
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger Vercel deployment
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL" || { echo "Missing VERCEL_DEPLOY_HOOK_URL secret"; exit 1; }
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Check Vercel production site
        env:
          VERCEL_PRODUCTION_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
        run: |
          test -n "$VERCEL_PRODUCTION_URL" || { echo "Missing VERCEL_PRODUCTION_URL secret"; exit 1; }
          for attempt in $(seq 1 20); do
            if curl --location --fail --silent --show-error --max-time 10 "$VERCEL_PRODUCTION_URL" >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          echo "Vercel availability check did not succeed"
          exit 1
